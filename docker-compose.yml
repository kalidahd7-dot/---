version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jazari
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]

volumes:
  pgdata: